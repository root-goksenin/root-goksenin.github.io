# Reading list, shown on the /reading/ page of the website.
#
# Add a paper: copy these two lines under "papers:" and paste an arXiv link or ID.
#
#   - arxiv: https://arxiv.org/abs/2501.14459
#     status: to-read
#
# When you have read it, change "to-read" to "read". Optionally add the date and a short note:
#
#   - arxiv: https://arxiv.org/abs/2501.14459
#     status: read
#     read_on: 2026-10-06
#     note: Integrated gradients show what domain adaptation changes in a dense retriever.
#
# The title, authors and year are filled in from arXiv every time the site is built, so you only
# need the link. You can also write them yourself with title:, authors: and year:.
# Tip: use the full arXiv link (or put the ID in quotes, e.g. "2509.23230") so YAML does not turn
# the ID into a number.
#
# Optional extras: venue: (e.g. CVPR 2024) is shown next to the arXiv ID, added: is the date you
# queued it, and pdf: replaces the arXiv PDF link (e.g. with the conference version).
#
# A paper that is not on arXiv needs url:, title:, authors: and year: instead of arxiv:
#
#   - url: https://openreview.net/forum?id=...
#     pdf: https://openreview.net/pdf?id=...
#     title: "Paper title"
#     authors: [First Author, Second Author]
#     year: 2026
#     venue: ICLR 2026
#     status: to-read
#
# Put titles in quotes when they contain a colon.

# The text at the top of the page and above each list. Markdown works: **bold**, [link](https://...).
intro: |
  Reading is where most of my research starts. This page tracks the papers closest to my work: spatial audio understanding, self-supervised audio and speech representation learning, and audio-language models. Keeping the list public keeps me honest about reading what I save, and lets collaborators, students and anyone curious see what I'm thinking about.

  Know a paper that belongs here? [Send it to me](mailto:goksenin.yuksel@donders.ru.nl).

to_read_intro: >
  Papers I've saved and plan to read next. Most are about spatial audio, audio-visual learning and
  audio-language models.

read_intro: >
