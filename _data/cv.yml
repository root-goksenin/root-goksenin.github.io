  sections:
    Research Interests:
      - label: Machine hearing
        details: "Models that understand real-world sound scenes: what is heard and where it comes from"
      - label: Representation learning
        details: "Self-supervised learning (masked autoencoders, JEPA), audio foundation models, robustness to noise and reverberation"
      - label: Spatial audio
        details: "Ambisonics, binaural audio, geometry-agnostic spatial representations for arbitrary microphone arrays, sound event localization and detection (SELD), equivariant models, spatial audio large language models"
      - label: Speech
        details: "Compute-efficient self-supervised speech representation learning, automatic speech recognition (ASR)"

